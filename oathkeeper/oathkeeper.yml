# Ory Oathkeeper: the only way into your app.
#
# For every request it: authenticates (Kratos session cookie) -> authorizes -> mutates
# (replaces the cookie with a short-lived signed JWT in `Authorization: Bearer ...`).
# Your backend never sees sessions; it just verifies JWTs against the public JWKS.
#
# Which routes need what is defined in access-rules.yml.
# Reference: https://www.ory.sh/docs/oathkeeper/reference/configuration

serve:
  proxy:
    port: 4455
  api:
    port: 4456

access_rules:
  matching_strategy: glob
  repositories:
    - file:///etc/config/oathkeeper/access-rules.yml

authenticators:
  # Public routes.
  noop:
    enabled: true

  # Logged-in routes: asks Kratos who owns the session cookie.
  cookie_session:
    enabled: true
    config:
      check_session_url: http://kratos:4433/sessions/whoami
      preserve_path: true
      only:
        - ory_kratos_session
      subject_from: identity.id
      extra_from: "@this"

  # Non-browser clients (CLI, mobile): `Authorization: Bearer <kratos session token>`.
  bearer_token:
    enabled: true
    config:
      check_session_url: http://kratos:4433/sessions/whoami
      preserve_path: true
      subject_from: identity.id
      extra_from: "@this"

authorizers:
  allow:
    enabled: true
  deny:
    enabled: true

mutators:
  noop:
    enabled: true

  # Blanks the Kratos session cookie before forwarding, so your app never holds
  # a session credential (other cookies pass through). Used on every rule.
  cookie:
    enabled: true
    config:
      cookies:
        ory_kratos_session: ""

  # Asks user-service for the user's profile + roles and adds them to the session as
  # `extra.profile`; creates the user-service row on first sight. Runs before id_token.
  # Any non-200 from user-service fails the request (it's on the critical path).
  hydrator:
    enabled: true
    config:
      api:
        url: http://user-service:3001/internal/hydrate
        auth:
          basic:
            username: oathkeeper
            # Overridden by MUTATORS_HYDRATOR_CONFIG_API_AUTH_BASIC_PASSWORD (from .env).
            password: overridden-by-env
        retry:
          give_up_after: 2s
          max_delay: 200ms

  # Mints the JWT your backend receives. `sub` = Kratos identity id.
  id_token:
    enabled: true
    config:
      issuer_url: http://localhost:8080/
      # Generated by `just init`, gitignored. Public half served at http://oathkeeper:4456/.well-known/jwks.json
      jwks_url: file:///etc/config/oathkeeper/id_token.jwks.json
      # Minted fresh per request, so it only needs to outlive that request.
      ttl: 1m
      # Go template over the session: .Extra is the Kratos session (identity, aal),
      # .Extra.profile is what user-service's hydrator added (display_name, roles).
      claims: |
        {
          "email": {{ .Extra.identity.traits.email | toJson }},
          "display_name": {{ .Extra.profile.display_name | toJson }},
          "roles": {{ .Extra.profile.roles | toJson }},
          "aal": {{ .Extra.authenticator_assurance_level | toJson }}
        }

errors:
  fallback:
    - json
  handlers:
    json:
      enabled: true
      config:
        verbose: true
    # Browsers hitting a protected page get sent to login and back.
    redirect:
      enabled: true
      config:
        to: http://localhost:4433/self-service/login/browser
        return_to_query_param: return_to

log:
  level: info
  format: text
