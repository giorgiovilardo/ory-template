# Ory Kratos config for local development.
# Secrets and the DSN come from env vars (see docker-compose.yml / .env).
# Social providers are injected by entrypoint.sh based on which *_CLIENT_ID vars are set.
# Reference: https://www.ory.sh/docs/kratos/reference/configuration

version: v26.2.0

serve:
  public:
    base_url: http://localhost:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:8080
        - http://localhost:4455
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://localhost:4455/
  # Where Kratos is allowed to send users back to after login/registration/logout.
  # Add your side project's URL here.
  allowed_return_urls:
    - http://localhost:4455
    - http://localhost:8080

  methods:
    password:
      enabled: true
    # Email one-time codes: passwordless login, plus verification & recovery.
    code:
      enabled: true
      passwordless_enabled: true
    passkey:
      enabled: true
      config:
        rp:
          display_name: My Side Project
          id: localhost
          origins:
            - http://localhost:4455
    # Optional 2FA users can enable from the settings page.
    totp:
      enabled: true
      config:
        issuer: My Side Project
    lookup_secret:
      enabled: true
    # Social login. Enabled/disabled and populated by entrypoint.sh.
    oidc:
      enabled: false

  flows:
    error:
      ui_url: http://localhost:4455/error

    settings:
      ui_url: http://localhost:4455/settings
      privileged_session_max_age: 15m
      required_aal: highest_available
      after:
        # The profile method is where the email (the only trait) changes.
        profile:
          hooks:
            # The user-service web hook: tells user-service an identity was saved, so it
            # creates the user's row (with the `user` role) at registration and keeps its
            # email copy current. Defined here (YAML anchor) and reused by every
            # registration method below. Runs after the identity is persisted
            # (`parse: false`) and synchronously (`ignore: false`): Kratos retries 5xx,
            # then fails the flow, but the identity exists either way; `just reconcile`
            # catches up on anything missed. The password comes from .env
            # (KRATOS_WEBHOOK_PASSWORD), set by docker-compose.yml for each use.
            - &user_service_hook
              hook: web_hook
              config:
                url: http://user-service:3001/internal/kratos/identity
                method: POST
                body: file:///etc/config/kratos/webhooks/identity.jsonnet
                response:
                  parse: false
                  ignore: false
                auth:
                  type: basic_auth
                  config:
                    user: kratos
                    password: overridden-by-env

    recovery:
      enabled: true
      ui_url: http://localhost:4455/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://localhost:4455/verification
      use: code
      after:
        default_browser_return_url: http://localhost:4455/

    logout:
      after:
        default_browser_return_url: http://localhost:4455/login

    login:
      ui_url: http://localhost:4455/login
      lifespan: 10m

    registration:
      ui_url: http://localhost:4455/registration
      lifespan: 10m
      # Each method: the user-service web hook first, so a session is issued only once
      # the user's row exists.
      after:
        password:
          hooks:
            - *user_service_hook
            - hook: session
            - hook: show_verification_ui
        code:
          hooks:
            - *user_service_hook
            - hook: session
        passkey:
          hooks:
            - *user_service_hook
            - hook: session
        oidc:
          hooks:
            - *user_service_hook
            - hook: session

session:
  lifespan: 720h # 30 days
  whoami:
    required_aal: highest_available

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@example.com
    from_name: My Side Project

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt

log:
  level: info
  format: text
  leak_sensitive_values: false
